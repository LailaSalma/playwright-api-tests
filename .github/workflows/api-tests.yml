# Runs the Playwright API tests suite on every push and pull request to main.
name: API tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '45 6 * * *'
      timezone: "Africa/Cairo"
  workflow_dispatch:

jobs:
  APItests:
    runs-on: ubuntu-latest
    env:
      BOOKING_BASE_URL: ${{ vars.BOOKING_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium
        
      - name: Test APIs
        env:
          BOOKING_USERNAME: ${{ secrets.BOOKING_USERNAME }}
          BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
        run: npx playwright test
        
      - name: Upload HTML report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-history.jsonl
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            allure-history-
      - name: Generate Allure report
        run: npx allure generate ./allure-results --clean
        if: ${{ !cancelled() }}
      - name: Save Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: allure-history.jsonl
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Allure report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
